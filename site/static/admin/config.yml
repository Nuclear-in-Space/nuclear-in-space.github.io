local_backend: true

backend:
  name: github
  repo: Nuclear-in-Space/nuclear-in-space.github.io
  branch: refactor/hugo-migration
  base_url: https://sveltia-cms-auth.nalin-gupta3142.workers.dev/

# i18n configuration: use separate root folders for each locale
i18n:
  structure: multiple_root_folders
  locales: [en, fr]
  default_locale: en

media_folder: "site/static/media"
public_folder: "/media"

collections:
  - name: pages
    label: Pages
    folder: "site/content/{{locale}}"
    create: true
    delete: true
    fields:
      - { label: Title, name: title, widget: string, i18n: true}
      - { label: Body, name: body, widget: markdown, i18n: true}
